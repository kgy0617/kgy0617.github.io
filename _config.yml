# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

title: "Giyong Kim"
tagline: "AI & Central Banking Engineering"
author: "Giyong Kim"
description: >-
  AI engineering, multi-agent simulation systems, central banking software, and empirical econometric analysis — research and projects by Giyong Kim.
baseurl: ""
url: "https://kgy0617.github.io"
github_username: kgy0617
linkedin_username: giyong-kim-503522139
# Set a real address here to show a contact email in the footer.
# email: you@example.com

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Top navigation: pages shown in the header
header_pages:
  - portfolio.md
  - ai-dev.md
  - archive.md
  - about.markdown

# Exclude from processing
exclude:
  - README.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
