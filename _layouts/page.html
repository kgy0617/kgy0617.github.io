---
layout: default
---
<article class="post">

  {%- comment -%}
    Pages whose content already opens with its own title (the portfolio hero)
    set `hide_title: true` so the heading is not rendered twice.
  {%- endcomment -%}
  {%- unless page.hide_title -%}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {%- endunless -%}

  <div class="post-content">
    {{ content }}
  </div>

</article>
